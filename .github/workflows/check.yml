name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests
        run: tests/run.sh
      - name: Shell syntax
        run: for f in shared/*.sh skills/*/scripts/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Node syntax
        run: for f in shared/*.js skills/*/scripts/*.js; do node --check "$f"; done
