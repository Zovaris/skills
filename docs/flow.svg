<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the smithy skills work together</title>
  <desc>use-smithy routes work to smelt for one task or warden for many; both share one task list; warden runs workers in worktrees; tend keeps their pull requests green until they merge; scout, ledger, hush and simple help along the way.</desc>
  <style>
    .bg { fill: #ffffff; }
    .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .k { font-size: 11px; font-weight: 600; letter-spacing: .04em; fill: #59636e; }
    .chip { font-size: 12px; font-weight: 600; fill: #1f2328; }
    .neutral { fill: #f6f8fa; stroke: #d1d9e0; }
    .router { fill: #ddf4ff; stroke: #54aeff; }
    .smelt { fill: #f3f0ff; stroke: #8b7fe0; }
    .warden { fill: #dafbe1; stroke: #4ac26b; }
    .tend { fill: #fff1e5; stroke: #fb8f44; }
    .done { fill: #f6f8fa; stroke: #8250df; }
    .worker { fill: #ffffff; stroke: #4ac26b; }
    .lane { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .chip { fill: #f0f6fc; }
      .s, .k { fill: #9198a1; }
      .neutral { fill: #151b23; stroke: #3d444d; }
      .router { fill: #0c2d4f; stroke: #4493f8; }
      .smelt { fill: #231f3d; stroke: #8b7fe0; }
      .warden { fill: #0f2a19; stroke: #3fb950; }
      .tend { fill: #3a2210; stroke: #db6d28; }
      .done { fill: #151b23; stroke: #ab7df8; }
      .worker { fill: #0d1117; stroke: #3fb950; }
      .lane { stroke: #3d444d; }
      .line { stroke: #656c76; }
      .head { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="440" rx="14"/>

  <!-- entry -->
  <rect class="neutral" x="24" y="150" width="104" height="64" rx="12"/>
  <text class="t" x="76" y="178" text-anchor="middle">You</text>
  <text class="s" x="76" y="197" text-anchor="middle">an idea or tasks</text>

  <rect class="router" x="160" y="122" width="128" height="120" rx="12"/>
  <text class="k" x="224" y="150" text-anchor="middle">ROUTER</text>
  <text class="t" x="224" y="174" text-anchor="middle">use-smithy</text>
  <text class="s" x="224" y="194" text-anchor="middle">picks the skill</text>
  <text class="s" x="224" y="210" text-anchor="middle">shared rules</text>

  <!-- one task lane -->
  <text class="k" x="328" y="34">ONE TASK</text>
  <rect class="smelt" x="324" y="44" width="264" height="84" rx="12"/>
  <text class="t" x="456" y="72" text-anchor="middle">smelt</text>
  <text class="s" x="456" y="92" text-anchor="middle">brainstorm → spec → TDD</text>
  <text class="s" x="456" y="110" text-anchor="middle">test agents → review → PR</text>

  <!-- task list -->
  <rect class="neutral" x="324" y="168" width="264" height="64" rx="12"/>
  <text class="t" x="456" y="194" text-anchor="middle">Task list</text>
  <text class="s" x="456" y="213" text-anchor="middle">NN-slug.md · status · blocked by · PR</text>

  <!-- many tasks lane -->
  <text class="k" x="328" y="270">MANY TASKS</text>
  <rect class="warden" x="324" y="280" width="264" height="104" rx="12"/>
  <text class="t" x="456" y="306" text-anchor="middle">warden</text>
  <text class="s" x="456" y="325" text-anchor="middle">one silent worker per task, own worktree</text>
  <rect class="worker" x="346" y="340" width="66" height="28" rx="8"/>
  <text class="s" x="379" y="359" text-anchor="middle">worker</text>
  <rect class="worker" x="423" y="340" width="66" height="28" rx="8"/>
  <text class="s" x="456" y="359" text-anchor="middle">worker</text>
  <rect class="worker" x="500" y="340" width="66" height="28" rx="8"/>
  <text class="s" x="533" y="359" text-anchor="middle">worker</text>

  <!-- PRs, tend, merged -->
  <rect class="neutral" x="628" y="150" width="108" height="64" rx="12"/>
  <text class="t" x="682" y="178" text-anchor="middle">Pull</text>
  <text class="t" x="682" y="197" text-anchor="middle">requests</text>

  <rect class="tend" x="628" y="268" width="108" height="76" rx="12"/>
  <text class="t" x="682" y="294" text-anchor="middle">tend</text>
  <text class="s" x="682" y="313" text-anchor="middle">CI · rebases</text>
  <text class="s" x="682" y="329" text-anchor="middle">review threads</text>

  <rect class="done" x="776" y="150" width="160" height="64" rx="12"/>
  <text class="t" x="856" y="178" text-anchor="middle">Merged</text>
  <text class="s" x="856" y="197" text-anchor="middle">worktrees cleaned up</text>

  <!-- arrows -->
  <path class="line" d="M128 182H158" marker-end="url(#a)"/>
  <path class="line" d="M288 160C306 160 306 86 322 86" marker-end="url(#a)"/>
  <path class="line" d="M288 182H322" marker-end="url(#a)"/>
  <path class="line" d="M288 204C306 204 306 332 322 332" marker-end="url(#a)"/>
  <path class="line" d="M456 128V166" marker-end="url(#a)"/>
  <text class="s" x="464" y="152">plan</text>
  <path class="line" d="M456 232V278" marker-end="url(#a)"/>
  <text class="s" x="464" y="260">ready tasks</text>
  <path class="line" d="M588 86C610 86 610 170 626 170" marker-end="url(#a)"/>
  <path class="line" d="M588 332C610 332 610 196 626 196" marker-end="url(#a)"/>
  <path class="line" d="M682 214V266" marker-end="url(#a)"/>
  <path class="line" d="M736 306C756 306 756 200 774 200" marker-end="url(#a)"/>
  <path class="line" d="M736 182H774" marker-end="url(#a)"/>

  <!-- helpers -->
  <rect class="lane" x="24" y="398" width="912" height="30" rx="10"/>
  <text class="k" x="40" y="417">ALONG THE WAY</text>
  <text class="chip" x="160" y="418">scout</text><text class="s" x="200" y="418">facts with sources</text>
  <text class="chip" x="340" y="418">ledger</text><text class="s" x="388" y="418">ADRs · docs · comments</text>
  <text class="chip" x="560" y="418">hush</text><text class="s" x="598" y="418">no talk</text>
  <text class="chip" x="676" y="418">simple</text><text class="s" x="726" y="418">plain replies</text>
</svg>
